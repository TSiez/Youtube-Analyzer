services:
  - type: web
    name: youtube-analyst
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Single-video analysis needs only these two — set them in the Render dashboard.
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Weekly-trends (Sheets / Slides / Gmail). To make these work headless:
      #   1. Add two Secret Files in the Render dashboard (Environment > Secret Files):
      #        credentials.json  -> your OAuth Desktop client JSON
      #        token.json        -> the token generated locally (has the refresh token)
      #      Render mounts them at /etc/secrets/<name>, which the app reads automatically.
      #   2. OAUTH_NONINTERACTIVE=1 (below) tells the app never to attempt a browser flow.
      #   3. Publish the OAuth consent screen ("In production") so the refresh token
      #      doesn't expire every 7 days (Testing-mode tokens do).
      - key: OAUTH_NONINTERACTIVE
        value: "1"
      - key: SENDER_EMAIL
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      - key: SPREADSHEET_ID
        sync: false
      - key: PRESENTATION_ID
        sync: false
